name: Feature request
description: Suggest an improvement to Elozi.
title: "feat: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: For a new channel, LLM provider or third-party tool, please use the **Integration request** form instead.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what makes it hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should it work? Mockups and examples are welcome (synthetic data only).
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: contribute
    attributes:
      label: Would you like to work on it?
      options: ["Yes, I can open a PR", "Maybe, with guidance", "No"]
